          def read(path):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def code_chars(text):
              out = []
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"' or c == "'":
                      q = c
                      i += 1
                      while i < n:
                          if text[i] == "\\" and i + 1 < n:
                              i += 2
                              continue
                          ch = text[i]
                          i += 1
                          if ch == q or ch == "\n":
                              break
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "/":
                      while i < n and text[i] != "\n":
                          i += 1
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "*":
                      j = text.find("*/", i + 2)
                      i = n if j == -1 else j + 2
                      continue
                  out.append(c)
                  i += 1
              return "".join(out)


          def strip_hash_line(line):
              out = []
              i = 0
              n = len(line)
              quote = None
              while i < n:
                  c = line[i]
                  if quote is None:
                      if c == "\\":
                          out.append(c)
                          if i + 1 < n:
                              out.append(line[i + 1])
                          i += 2
                          continue
                      if c == "'" or c == '"':
                          quote = c
                          out.append(c)
                          i += 1
                          continue
                      if c == "#" and (i == 0 or line[i - 1] in " \t"):
                          break
                      out.append(c)
                      i += 1
                      continue
                  out.append(c)
                  if c == "\\" and i + 1 < n:
                      out.append(line[i + 1])
                      i += 2
                      continue
                  if c == quote:
                      quote = None
                  i += 1
              return "".join(out).rstrip()


