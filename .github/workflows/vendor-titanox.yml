name: Vendor Titanox
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream
        run: |
          rm -rf /tmp/up
          git clone --depth 1 https://github.com/Ragekill3377/Titanox.git /tmp/up
          rm -rf /tmp/up/.git

      - name: Copy
        run: cp -an /tmp/up/. .

      - name: Patch segment name
        run: |
          grep -rl 'HOOK_DATA_SEGMENT.*"__TITANOX_HOOK"' . 2>/dev/null | while read f; do
            echo "patch $f"
            sed -i.bak 's/HOOK_DATA_SEGMENT.*"__TITANOX_HOOK"/HOOK_DATA_SEGMENT = "__TITANOX_DATA"/' "$f"
            rm -f "$f.bak"
          done
          grep -rn 'HOOK_TEXT_SEGMENT\|HOOK_DATA_SEGMENT' . | head || true

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "vendor titanox"
          git push