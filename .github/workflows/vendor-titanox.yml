                      continue
                  checked += 1
              print("ok shell code untouched: " + str(checked) + " stripped files match git HEAD")


          def check_braces():
              bad = []
              for path in source_files():
                  body = code_chars(read(path))
                  if body.count("{") != body.count("}") or body.count("(") != body.count(")"):
                      bad.append(path)
              if bad:
                  for path in bad:
                      fail("unbalanced braces in " + path)
              else:
                  print("ok braces: balanced")


          def check_hook_c():
              path = "libtitanox/brk_hook/Hook/hook.c"
              if not os.path.isfile(path):
                  fail("hook.c missing")
                  return
              body = read(path)
              for sym in HOOK_C_SYMBOLS:
                  if sym not in body:
                      fail("hook.c lacks " + sym)
              for bad in HOOK_C_FORBIDDEN:
                  if bad in body:
                      fail("hook.c still contains " + bad)
              print("ok hook.c: " + str(len(HOOK_C_SYMBOLS)) + " symbols present")


          def check_cross_file():
              header = read("libtitanox/brk_hook/Hook/hook.h")
              hook = read("libtitanox/brk_hook/Hook/hook.c")
              objc = read("libtitanox/libtitanox/main.mm")
              decl = read("libtitanox/libtitanox/libtitanox.h")
              for sym in ("brk_install", "brk_remove", "brk_original_ptr", "brk_suspend_self",
                          "brk_resume_self", "brk_selftest"):
                  if sym not in header:
                      fail("hook.h lacks " + sym)
                  if sym not in hook:
                      fail("hook.c lacks " + sym)
              for method in ("originalPointerForBreakpoint", "suspendBreakpoints", "resumeBreakpoints",
                             "breakpointSelfTest", "breakpointSlotLimit"):
                  if method not in objc:
                      fail("main.mm lacks " + method)
                  if method not in decl:
                      fail("libtitanox.h lacks " + method)
              if "OXLogC" in hook or "OXLogC" in objc:
                  fail("OXLogC still referenced")
              print("ok cross file: header, hook.c, main.mm, libtitanox.h agree")


          def blank_includes(text):
              out = []
              for line in text.split("\n"):
                  s = line.lstrip()
                  if s.startswith("#include") or s.startswith("#import") or s.startswith("#pragma once"):
                      out.append("")
                  else:
                      out.append(line.replace("#import", "#include"))
              return "\n".join(out)


          def preprocess(text):
              handle, path = tempfile.mkstemp(suffix=".c", dir="/tmp")
              with os.fdopen(handle, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(blank_includes(text))
              proc = subprocess.run(
                  ["gcc", "-E", "-P", "-nostdinc", "-Wno-unknown-pragmas", "-D__has_feature(x)=0",
                   "-x", "c", path],
                  capture_output=True, text=True)
              os.unlink(path)
              return proc.returncode, proc.stdout


          def check_code_untouched():
              checked = 0
              for path in source_files():
                  if path in REWRITTEN:
                      continue
                  old = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
                  if old.returncode != 0:
                      continue
                  new = read(path)
                  if old.stdout == new:
                      continue
                  rc_a, out_a = preprocess(old.stdout)
                  rc_b, out_b = preprocess(new)
                  if rc_a != rc_b or out_a != out_b:
                      fail("preprocessing changed for " + path)
                      continue
                  checked += 1
              print("ok code untouched: " + str(checked) + " stripped files match git HEAD")


          def check_syntax():
              root = "/tmp/titanox_stub"
              for rel, body in STUBS.items():
                  path = os.path.join(root, rel)
                  d = os.path.dirname(path)
                  if d and not os.path.isdir(d):
                      os.makedirs(d)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(body)
              hook_dir = "libtitanox/brk_hook/Hook"
              gcc = subprocess.run(
                  ["gcc", "-fsyntax-only", "-Wall", "-Wextra", "-Wno-unused-parameter",
                   "-x", "c", "-I", root, "-I", hook_dir, hook_dir + "/hook.c"],
                  capture_output=True, text=True)
              if gcc.returncode != 0:
                  fail("hook.c does not compile against stub mach headers")
                  print(gcc.stderr[:4000])
              else:
                  print("ok syntax: hook.c compiles clean")


          def main():
              os.chdir(ROOT)
              check_comments()
              check_shell_syntax()
              check_hash_untouched()
              check_braces()
              check_hook_c()
              check_syntax()
              check_cross_file()
              check_code_untouched()
              if errors:
                  print("VERIFY FAILED: " + str(len(errors)))
                  sys.exit(1)
              print("VERIFY OK")


          main()

          PYVERIFY

      - name: Commit
        run: |
          git config user.name titanox-bot
          git config user.email titanox-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "brk hook: hardware breakpoint rework [skip ci]"
          git push || (git pull --rebase && git push)
