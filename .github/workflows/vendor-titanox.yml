          def method_span(text, sig):
              start = text.find(sig)
              if start < 0:
                  return None
              i = text.find("{", start)
              if i < 0:
                  return None
              depth = 0
              while i < len(text):
                  ch = text[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return (start, i + 1)
                  i += 1
              return None


          def swap_method(text, sig, new_body, label):
              span = method_span(text, sig)
              if span is None:
                  if new_body.splitlines()[0] in text:
                      note(label + " already patched")
                      return text
                  die("cannot locate " + label)
              return text[:span[0]] + new_body + text[span[1]:]


          def patch_header():
              path = os.path.join("libtitanox", "libtitanox", "libtitanox.h")
              text = read(path)
              if ADD_DECL_NEW.splitlines()[-1] in text and "originalPointerForBreakpoint" in text:
                  note("libtitanox.h already patched")
                  return
              if ADD_DECL_OLD not in text:
                  die("breakpoint declarations not found in libtitanox.h")
              write(path, text.replace(ADD_DECL_OLD, ADD_DECL_NEW, 1))
              note("libtitanox.h declarations extended")


          def patch_main():
              path = os.path.join("libtitanox", "libtitanox", "main.mm")
              text = read(path)

              text = swap_method(text, ADD_METHOD_SIG, ADD_METHOD_NEW, "addBreakpointAtAddress")

              span = method_span(text, REM_METHOD_SIG)
              if span is None:
                  die("cannot locate removeBreakpointAtAddress")
              extra = "" if "originalPointerForBreakpoint" in text else EXTRA_METHODS
              text = text[:span[0]] + REM_METHOD_NEW + extra + text[span[1]:]

              if PRAGMA_OLD in text:
                  text = text.replace(PRAGMA_OLD, PRAGMA_NEW, 1)

              write(path, text)
              note("main.mm breakpoint methods replaced")


